# Rebuilds the GitHub Pages dashboard from the published runs in history/runs.
# It reads saved files only; no API is called. One-time setup: Settings -> Pages ->
# Source: "GitHub Actions". The page contains forecasts and health checks, never post text.
name: dashboard

on:
  push:
    branches: [main]
    paths: ["history/**", "dashboard.py", "dashboard/**", "forecast.py"]
  workflow_run:
    workflows: [weekly-forecast]  # its commits use GITHUB_TOKEN, which does not trigger push events
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python dashboard.py --runs history/runs --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
