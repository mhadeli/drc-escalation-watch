# Manual pull, extraction and forecast in CI. There is no schedule, so nothing spends
# X or Gemini credits unless you start it from Actions -> weekly-forecast -> Run workflow.
# Needs repository secrets X_BEARER_TOKEN and GEMINI_API_KEY (or ANTHROPIC_API_KEY).
#
# The run's post-free files (manifest, forecast, health, scores) are published to
# history/runs on main, which rebuilds the dashboard. Raw posts, tagged posts and the
# brief are kept only as a 90-day build artifact (X terms: post text is not committed).
name: weekly-forecast

on:
  workflow_dispatch:
    inputs:
      extractor:
        description: '"rules", a gemini-* or a claude-* model id'
        default: gemini-3.8-flash

concurrency:
  group: weekly-forecast

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EXTRACTOR: ${{ inputs.extractor || 'gemini-3.8-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

      - name: Restore published runs for run-to-run checks
        run: |
          mkdir -p data/runs
          if [ -d history/runs ]; then cp -R history/runs/. data/runs/; fi

      - name: Pull posts and forecast
        run: python pipeline.py run --fetch --extractor "$EXTRACTOR"

      - name: Publish and score
        if: always()
        run: |
          python pipeline.py publish || echo "no new run to publish"
          python pipeline.py score
          git add history
          if git diff --cached --quiet; then echo "nothing new to publish"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish forecast run $(date -u +%Y-%m-%d) ($EXTRACTOR)"
          git push -q origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ github.run_id }}
          path: |
            data/raw/
            data/runs/
          retention-days: 90

      - name: Brief
        if: always()
        run: |
          for brief in data/runs/*/brief.md; do
            if [ -f "$brief" ]; then cat "$brief" >> "$GITHUB_STEP_SUMMARY"; fi
          done
